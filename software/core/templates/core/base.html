<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Smart Attendance{% endblock %}</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--mut:#94a3b8;--ok:#22c55e;--warn:#f59e0b;--bad:#ef4444;--acc:#38bdf8}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,Arial;background:var(--bg);color:#e2e8f0}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 22px;background:#020617;border-bottom:1px solid #334155}
header a{color:var(--acc);text-decoration:none;margin-left:14px}main{max-width:1150px;margin:20px auto;padding:0 16px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.card{background:var(--card);border-radius:12px;padding:16px;margin-bottom:14px}.card h3{margin:0 0 8px;color:var(--acc)}
.big{font-size:32px;font-weight:700}table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:7px 8px;text-align:left;border-bottom:1px solid #334155}th{color:var(--mut)}
.pill{padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600}
.GOOD,.PRESENT,.on{background:#14532d;color:#86efac}.WARNING,.LATE{background:#78350f;color:#fcd34d}
.AT_RISK,.ABSENT,.off{background:#7f1d1d;color:#fca5a5}
input,select,button{padding:7px;border-radius:8px;border:1px solid #475569;background:#0f172a;color:#e2e8f0}
button{background:var(--acc);color:#04202e;border:0;font-weight:700;cursor:pointer}
.msg{padding:8px 12px;border-radius:8px;background:#14532d;margin-bottom:10px}.msg.error{background:#7f1d1d}
.bar{height:8px;background:#334155;border-radius:9px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--ok)}
form.inline{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
</style></head><body>
<header><b>Smart Academic Attendance</b><span>
{% if user.is_authenticated %}{{ user.display_name }} ({{ user.get_role_display }}) <a href="/simulator/">Device simulator</a> <a href="/api/v1/">API</a>
<form method="post" action="/logout/" style="display:inline">{% csrf_token %}<button style="margin-left:14px">Logout</button></form>{% endif %}</span></header>
<main>{% for m in messages %}<div class="msg {{ m.tags }}">{{ m }}</div>{% endfor %}{% block body %}{% endblock %}</main>
</body></html>
